name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: novatech_test
          POSTGRES_USER: novatech
          POSTGRES_PASSWORD: novatech
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://novatech:novatech@127.0.0.1:5432/novatech_test
      TEST_DATABASE_URL: postgresql+psycopg://novatech:novatech@127.0.0.1:5432/novatech_test
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_ORIGIN: http://testserver
      ALLOWED_HOSTS: '["testserver","127.0.0.1","localhost"]'
      SESSION_SECRET: test-session-secret-with-at-least-32-bytes
      CSRF_SECRET: test-csrf-secret-with-at-least-32-bytes
      OTP_SECRET: test-otp-secret-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy backend/app
      - run: alembic upgrade head
      - run: pytest
      - run: bandit -q -r backend/app
      - run: pip-audit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -t novatech-store .
